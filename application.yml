spring:
  datasource:
    url:  jdbc:postgresql://dpg-dbnila8u01pc73cs3lr0-a.oregon-postgres.render.com:5432/projeto_vivaleve?sslmode=require&channelBinding=disable
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      port: 5432
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configuração do JWT emitido pelo AuthService.
# JWT_SECRET deve ter pelo menos 32 caracteres (exigência do HS256).
jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

# Login com Google (POST /v1/auth/google, usado pelo botão "Entrar com Google" no front).
# Client ID da credencial "Web application" criada no Google Cloud Console — o MESMO usado no front.
# É usado pelo GoogleTokenVerifier para conferir o "aud": só tokens emitidos para ESTE app são aceitos.
# Não precisa de client-secret: o ID Token é validado com as chaves públicas do Google.
# No Google Cloud Console, o domínio do front precisa estar em "Authorized JavaScript origins".
google:
  client-id: ${GOOGLE_CLIENT_ID}

# Domínios do front autorizados a chamar a API pelo navegador (separados por vírgula).
# Ex.: CORS_ALLOWED_ORIGINS=https://seu-front.vercel.app,http://localhost:5500
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}