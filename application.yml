spring:
  config:
    # Lê variáveis do arquivo .env na raiz (se existir). Copie .env.example para .env.
    import: optional:file:.env[.properties]
  datasource:
    url:  jdbc:postgresql://dpg-dbnila8u01pc73cs3lr0-a.oregon-postgres.render.com:5432/projeto_vivaleve?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      port: 5432
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

pluma:
  ai:
    # Ollama Cloud: crie a chave em https://ollama.com/settings/keys e exporte OLLAMA_API_KEY
    base-url: ${OLLAMA_BASE_URL:https://ollama.com}
    api-key: ${OLLAMA_API_KEY:}
    model: ${OLLAMA_MODEL:gpt-oss:20b}
    temperature: 0.7
    max-tokens: 600
    timeout: 30s
    history-limit: 10
    max-response-chars: 2000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
